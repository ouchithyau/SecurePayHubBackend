version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: securepay_postgres
    environment:
      POSTGRES_DB: SecurePayDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - securepay-net

  redis:
    image: redis:alpine
    container_name: securepay_redis
    ports:
      - "6379:6379"
    networks:
      - securepay-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: securepay_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - securepay-net

  api:
    build:
      context: .
      dockerfile: SecurePayHub.API/Dockerfile
    container_name: securepay_api
    ports:
      - "5214:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=SecurePayDb;Username=postgres;Password=your_password
      - ConnectionStrings__Redis=redis:6379
      - 뺙RabbitMQ__Host=rabbitmq
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - securepay-net

volumes:
  postgres_data:

networks:
  securepay-net:
    driver: bridge