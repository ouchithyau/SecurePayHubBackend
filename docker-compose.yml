version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: securepay_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: SecurePayHubDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - securepay-net

  redis:
    image: redis:alpine
    container_name: securepay_redis
    ports:
      - "6379:6379"
    networks:
      - securepay-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: securepay_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - securepay-net

  api:
    build:
      context: ./SecurePayHubBackend
      dockerfile: SecurePayHub.API/Dockerfile
    container_name: securepay_api
    depends_on:
      - postgres
      - redis
      - rabbitmq
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=SecurePayHubDb;Username=postgres;Password=password123
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__Host=rabbitmq
    networks:
      - securepay-net

  nginx:
    image: nginx:alpine
    container_name: securepay_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - securepay-net

volumes:
  postgres_data:

networks:
  securepay-net:
